<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Smart Irrigation Dashboard</title>
<style>
  :root {
    --bg: #0b1020;
    --bg-2: #121a3a;
    --panel: rgba(22, 33, 60, 0.62);
    --panel-border: rgba(110, 135, 200, 0.22);
    --text: #e7edf7;
    --muted: #94a3bd;
    --card: rgba(38, 52, 88, 0.48);
    --card-border: rgba(120, 150, 220, 0.18);
    --accent: #22d39a;      /* green — wet / ok */
    --accent-2: #38bdf8;    /* sky */
    --warn: #fbbf24;        /* amber — between thresholds */
    --danger: #f87171;      /* red — dry */
    --radius: 18px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1200px 700px at 85% -15%, rgba(56, 189, 248, 0.14), transparent 55%),
      radial-gradient(900px 600px at -10% 120%, rgba(34, 211, 154, 0.1), transparent 55%),
      var(--bg);
    min-height: 100vh;
    color: var(--text);
  }

  /* ---------- layout ---------- */
  .container { max-width: 1240px; margin: 0 auto; padding: 28px 24px 44px; }

  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
    margin-bottom: 26px;
  }
  header h1 { font-size: 1.95rem; font-weight: 700; letter-spacing: -0.015em; }
  header h1 .accent { background: linear-gradient(90deg, var(--accent-2), var(--accent));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .live-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(34, 211, 154, 0.12);
    border: 1px solid rgba(34, 211, 154, 0.35);
    font-size: 0.82rem; font-weight: 600; color: var(--accent);
  }
  .live-pill .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 0 rgba(34, 211, 154, 0.7);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(34, 211, 154, 0.7); }
    70%  { box-shadow: 0 0 0 9px rgba(34, 211, 154, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 211, 154, 0); }
  }

  /* ---------- cards ---------- */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 18px 20px;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(120, 150, 220, 0.4); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35); }
  .card-label {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted); font-weight: 700;
  }
  .card-value { font-size: 2rem; font-weight: 700; margin-top: 8px; line-height: 1.2; }
  .card-unit { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }

  /* ---------- gauge ---------- */
  .gauge-block {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
  }
  .ring-wrap { position: relative; width: 165px; height: 165px; }
  .ring { width: 100%; height: 100%; }
  .ring circle { fill: none; stroke-width: 7; }
  .ring-bg { stroke: rgba(255, 255, 255, 0.09); stroke-linecap: round; }
  .ring-fill {
    stroke: url(#ringGrad);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.9s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .ring-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .ring-center .big { font-size: 1.55rem; font-weight: 700; }
  .ring-center .small { font-size: 0.78rem; color: var(--muted); }
  .gauge-badge {
    font-size: 0.78rem; padding: 5px 12px; border-radius: 999px; font-weight: 700;
    border: 1px solid transparent;
  }
  .gauge-badge.ok     { color: var(--accent);  background: rgba(34, 211, 154, 0.12); border-color: rgba(34, 211, 154, 0.3); }
  .gauge-badge.warn   { color: var(--warn);    background: rgba(251, 191, 36, 0.12); border-color: rgba(251, 191, 36, 0.3); }
  .gauge-badge.dry    { color: var(--danger);  background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.3); }

  /* ---------- bar ---------- */
  .bar-line { margin-top: 10px; }
  .bar-label { font-size: 0.8rem; display: flex; gap: 8px; align-items: baseline; color: var(--text); }
  .bar { height: 10px; border-radius: 999px; overflow: hidden; background: rgba(255, 255, 255, 0.08); }
  .bar-fill { height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    transition: width 1.1s cubic-bezier(0.2, 0.9, 0.3, 1); }
  .bar-fill.warn { background: linear-gradient(90deg, #fbbf24, #f87171); }
  .bar-fill.dry  { background: linear-gradient(90deg, #f87171, #b91c1c); }

  /* ---------- stats table ---------- */
  .panel {
    margin-top: 28px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 18px 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .panel h2 { font-size: 1.05rem; margin-bottom: 14px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--card-border); }
  th { color: var(--muted); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.05em; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: "Cascadia Mono", Consolas, monospace; }
  .pump-chip {
    display: inline-flex; align-items: center; gap: 8px; font-weight: 700;
    padding: 4px 12px; border-radius: 999px;
    background: rgba(34, 211, 154, 0.12); color: var(--accent);
    border: 1px solid rgba(34, 211, 154, 0.3);
  }
  .pump-chip.off { background: rgba(255,255,255,0.06); color: var(--muted); border-color: rgba(255,255,255,0.12); }
  .pump-chip::before {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; animation: pulse 2s infinite;
  }
  .pump-chip.off::before { animation: none; }

  /* ---------- responsive ---------- */
  @media (max-width: 660px) {
    .card-value { font-size: 1.6rem; }
    .ring-wrap { width: 135px; height: 135px; }
    .ring-center .big { font-size: 1.2rem; }
    header h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🌱 IoT <span class="accent">Smart Irrigation</span> Dashboard</h1>
      <span class="live-pill"><span class="dot"></span> System Live</span>
    </header>

    <section class="cards">
      <div class="card gauge-block">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="ringGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="var(--accent-2)"/>
                <stop offset="100%" stop-color="var(--accent)"/>
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="50" cy="50" r="44"/>
            <circle class="ring-fill" cx="50" cy="50" r="44"
                    stroke="url(#ringGrad)" stroke-width="7"
                    stroke-dasharray="276.46" stroke-dashoffset="276.46"
                    stroke-linecap="round"/>
          </svg>
          <div class="ring-center">
            <div class="big" id="moisture-value">0%</div>
            <div class="small">moisture</div>
          </div>
        </div>
        <span class="gauge-badge" id="moisture-badge">OK — optimal</span>
        <div class="bar-line">
          <div class="bar"><div class="bar-fill" id="moisture-bar"></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-label">Temperature</div>
        <div class="card-value" id="temperature">—</div>
        <div class="card-unit">°C</div>
        <div class="bar-line">
          <div class="bar"><div class="bar-fill" id="temperature-bar"></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-label">Humidity</div>
        <div class="card-value" id="humidity">—</div>
        <div class="card-unit">percent</div>
        <div class="bar-line">
          <div class="bar"><div class="bar-fill" id="humidity-bar"></div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-label">Pump Status</div>
        <span class="pump-chip" id="pump-status"><span class="pump-dot"></span>—</span>
        <div class="card-label" style="margin-top:8px">automated control</div>
      </div>

      <div class="card">
        <div class="card-label">Last Update</div>
        <div class="card-value mono" id="timestamp" style="font-size:1rem">—</div>
      </div>
    </section>

    <section class="panel">
      <h2>Recent readings</h2>
      <table>
        <thead>
          <tr><th>Raw ADC value</th><th>Device</th><th>Timestamp</th><th>Status</th></tr>
        </thead>
        <tbody>
          <tr><td class="mono" id="raw">—</td><td id="device">—</td>
              <td class="mono" id="ts">—</td><td id="alert">—</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <script>
    // Firebase Realtime Database URL the ESP32 firmware writes to
    const DB_URL = "https://soilmoisturedata-44dd2-default-rtdb.asia-southeast1.firebasedatabase.app/sensor.json";

    // Hysteresis thresholds — keep in sync with firmware/IoT_Farming_System.ino
    const DRY_THRESHOLD = 30;
    const WET_THRESHOLD = 45;

    // Circumference of the ring (r = 44 → 2πr ≈ 276.46)
    const RING_CIRC = 276.46;
    const $id = (id) => document.getElementById(id);

    function pct(v) { return typeof v === "number" ? Math.min(Math.max(v, 0), 100) : 0; }

    function update(data) {
      const moisture = pct(data.moisture);
      const temp     = data.temperature || 0;
      const hum      = data.humidity || 0;
      const pumpOn   = data.pump === 1;
      const ts       = data.timestamp ? String(data.timestamp) : "—";

      // --- moisture ring ---
      const ringFill = $id("ring-fill") || document.querySelector(".ring-fill");
      ringFill.style.strokeDashoffset = (RING_CIRC - (moisture / 100) * RING_CIRC).toFixed(2) + "px";

      const badge = $id("moisture-badge");
      if (moisture <= DRY_THRESHOLD) {
        badge.classList = "gauge-badge dry"; badge.textContent = "DRY — pump ON";
        ringFill.classList = "";
      } else if (moisture >= WET_THRESHOLD) {
        badge.classList = "gauge-badge ok"; badge.textContent = "WET — optimal";
      } else {
        badge.classList = "gauge-badge warn"; badge.textContent = "OK — in range";
      }

      $id("moisture-value").textContent = moisture + "%";
      const bar = $id("moisture-bar");
      bar.style.width = moisture + "%";
      bar.classList.toggle("warn", moisture > DRY_THRESHOLD && moisture < WET_THRESHOLD);
      bar.classList.toggle("dry", moisture <= DRY_THRESHOLD);

      // --- temperature / humidity bars (scaled 0-40 and 0-100) ---
      const tempBar = $id("temperature-bar");
      tempBar.style.width = Math.min(Math.max(temp, 0), 40) + "%";
      $id("temperature").textContent = temp;
      const humBar = $id("humidity-bar");
      humBar.style.width = hum + "%";
      $id("humidity").textContent = hum;

      // --- pump ---
      const pump = $id("pump-status");
      pump.className = "pump-chip" + (pumpOn ? "" : " off");
      pump.textContent = (pumpOn ? "ON" : "OFF");

      // --- stats ---
      $id("raw").textContent = data.raw ?? "—";
      $id("device").textContent = data.device || "—";
      $id("ts").textContent = ts;
      $id("timestamp").textContent = ts;

      // --- alert ---
      const alerts = [];
      if (moisture <= DRY_THRESHOLD) alerts.push("Soil is DRY — irrigation ON");
      else if (moisture >= WET_THRESHOLD) alerts.push("Soil is WET — irrigation OFF");
      else alerts.push("Moisture in optimal range");
      if (data.raw != null) alerts.push("Raw ADC: " + data.raw);
      $id("alert").textContent = alerts.join(" · ");
    }

    async function refresh() {
      try {
        const res = await fetch(DB_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (data && typeof data === "object") update(data);
      } catch (err) {
        console.error("Failed to fetch sensor data:", err);
      }
    }

    setInterval(refresh, 2000);          // poll every 2 seconds
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") refresh();
    });
    refresh();
  </script>
</body>
</html>
